plugins {
    id 'com.android.application'
}

android {
    namespace 'com.kieronquinn.app.simnumbersetter'
    compileSdk 36

    defaultConfig {
        applicationId "com.kieronquinn.app.simnumbersetter"
        minSdk 26
        targetSdk 32
        versionCode 3
        versionName "2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures {
        viewBinding true
        aidl true
        buildConfig true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.17.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'com.github.KieronQuinn:MonetCompat:0.4.1'
    implementation 'androidx.palette:palette:1.0.0'
    implementation 'io.insert-koin:koin-android:4.1.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.9.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.4'
    implementation 'com.github.topjohnwu.libsu:core:6.0.0'

    compileOnly project(path: ':systemstubs')
    // Vector supports the legacy Xposed API; no Vector-specific runtime is bundled.
    compileOnly 'de.robv.android.xposed:api:82'
}
